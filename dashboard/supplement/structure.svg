<svg xmlns="http://www.w3.org/2000/svg" width="960" height="270" viewBox="0 0 960 270" role="img" aria-label="PBR과 거버넌스의 네 집단"><rect width="960" height="270" fill="#f8fafc"/><g font-family="Arial,Malgun Gothic,sans-serif" fill="#12243c"><text x="28" y="35" font-size="20" font-weight="700">PBR × 거버넌스: 원문 투자 논리와 검증 대상</text><text x="230" y="76" font-size="16">Low-PBR</text><text x="620" y="76" font-size="16">High-PBR</text><rect x="180" y="95" width="330" height="64" fill="#dfeaf4" rx="6"/><rect x="560" y="95" width="330" height="64" fill="#dfeaf4" rx="6"/><text x="30" y="131" font-size="17">Good-G</text><text x="210" y="122" font-size="17">재평가 가능성 · VFS 50%</text><text x="210" y="146" font-size="13">저평가 + 양호한 거버넌스</text><text x="590" y="122" font-size="17">멀티플 유지 · VFS 50%</text><text x="590" y="146" font-size="13">높은 PBR + 양호한 거버넌스</text><text x="30" y="209" font-size="17">Bad-G</text><text x="210" y="200" font-size="17">가치 함정 가능성</text><text x="590" y="200" font-size="17">고평가 + 거버넌스 위험</text><text x="28" y="250" font-size="13" fill="#53657a">우리 연구의 G는 공시 사외이사 비율 · 원문 MSCI G와 다름 · 네 셀의 예상 논리를 독립 검증</text></g></svg>